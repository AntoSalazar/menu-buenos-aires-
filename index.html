<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f10">
<title>Menú · Restaurante Buenos Aires Terán</title>
<meta name="description" content="Menú de Restaurante Buenos Aires Terán: mariscos, carnes, vinos y licores, antojitos, postres y bebidas.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="tabs" aria-label="Páginas del menú">
  <button class="on" data-i="0">Antojitos y Bebidas</button>
  <button data-i="1">Mariscos y Carnes</button>
  <button data-i="2">Vinos y Licores</button>
</nav>
<main id="pages">
  <img src="img/menu-3-700.jpg" srcset="img/menu-3-700.jpg 700w, img/menu-3.jpg 1238w" sizes="(min-width:1000px) 33vw, (min-width:700px) 700px, 100vw" width="1238" height="1600" alt="Menú: Antojitos, postres, cervezas y bebidas.">
  <img loading="lazy" src="img/menu-1-700.jpg" srcset="img/menu-1-700.jpg 700w, img/menu-1.jpg 1238w" sizes="(min-width:1000px) 33vw, (min-width:700px) 700px, 100vw" width="1238" height="1600" alt="Menú: Mariscos y Carnes. Camarones, lizas, macabil, mojarra, cócteles, carne asada, cecina, costilla, chorizo y más.">
  <img loading="lazy" src="img/menu-2-700.jpg" srcset="img/menu-2-700.jpg 700w, img/menu-2.jpg 1238w" sizes="(min-width:1000px) 33vw, (min-width:700px) 700px, 100vw" width="1238" height="1600" alt="Menú: Vinos y Licores. Ron, tequilas, brandy, vodka, whiskys, digestivos y mezcal, precio por botella y por copa.">
</main>
<script>
const pages = document.getElementById("pages");
const tabs = [...document.querySelectorAll("#tabs button")];

const imgs = [...pages.querySelectorAll("img")];
tabs.forEach(b => b.addEventListener("click", () => imgs[b.dataset.i].scrollIntoView({ behavior: "smooth" })));

const io = new IntersectionObserver(es => {
  for (const e of es) if (e.isIntersecting) {
    const i = imgs.indexOf(e.target);
    tabs.forEach((b, n) => b.classList.toggle("on", n === i));
    const nav = tabs[i].parentElement;
    nav.scrollTo({ left: tabs[i].offsetLeft - (nav.clientWidth - tabs[i].offsetWidth) / 2, behavior: "smooth" });
  }
}, { rootMargin: "-40% 0px -55% 0px" });
imgs.forEach(i => io.observe(i));
</script>
</body>
</html>
